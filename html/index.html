<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Safety</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="hud" class="hud visible">
        <div class="shell">
            <div id="toast" class="toast" aria-live="polite"></div>
            <header class="header">
                <div>
                    <p class="eyebrow">Nova Safety</p>
                    <h1>Safety Zones</h1>
                </div>
                <div class="status" id="zoneStatus">Active</div>
            </header>

            <section class="panel">
                <div id="safetyBanner" class="safety-banner hidden">
                    You are currently in a safety area. Violating roleplay is not to take place in or near these areas.
                </div>
                <div class="field">
                    <span class="label">Coordinates</span>
                    <span class="value" id="playerCoords">0.00, 0.00, 0.00</span>
                </div>
                <div class="field">
                    <span class="label">Location</span>
                    <span class="value" id="zoneName">None</span>
                </div>
                <div class="field">
                    <span class="label">Zone Coordinates</span>
                    <span class="value" id="zoneCoords">N/A</span>
                </div>
                <div class="field">
                    <span class="label">Radius</span>
                    <span class="value" id="zoneRadius">N/A</span>
                </div>
            </section>

            <section class="panel list-panel">
                <div class="list-header">
                    <span>Current Safety Zones</span>
                    <span class="hint">Configured in config.lua</span>
                </div>
                <div id="zoneList" class="zone-list"></div>
            </section>

            <footer class="footer">
                Toggle with /Novasafe
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
